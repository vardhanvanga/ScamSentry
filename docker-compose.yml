services:
  # ── Backend Enterprise Gateway (FastAPI) ──────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scamsentry-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ScamSentry
      - APP_ENV=production
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./artifacts/logs:/app/artifacts/logs
      - ./artifacts/saved_models:/app/artifacts/saved_models:ro
      - ./data/processed:/app/data/processed:ro
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/switch/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Phase 5 Banking Dashboard (Streamlit) ─────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scamsentry-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - FASTAPI_GATEWAY_URL=http://gateway:8000
    volumes:
      - ./artifacts/logs:/app/artifacts/logs
      - ./artifacts/saved_models:/app/artifacts/saved_models:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      gateway:
        condition: service_healthy
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
