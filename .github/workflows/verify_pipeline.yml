name: Verify ScamSentry Pipeline & Production Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Lint with Ruff
        run: |
          ruff check backend/ ml_engine/ tests/ --ignore E501,E402

      - name: Style Consistency with Flake8
        run: |
          flake8 backend/ ml_engine/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

  test-suite:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  latency-regression-gate:
    name: Production Latency SLA Gate (< 100ms)
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -r requirements.txt

      - name: Enforce Switch Latency Benchmark SLA
        run: |
          python -c "
          import json, sys
          from ml_engine.benchmark_latency import run_latency_benchmark
          report = run_latency_benchmark(num_samples=50, num_warmup=5)
          p95 = report['latency_metrics_ms']['p95']
          print(f'P95 Latency: {p95:.2f} ms (SLA Limit: 100.0 ms)')
          if p95 >= 100.0:
              print(f'FAILURE: P95 latency {p95:.2f}ms breaches 100ms payment-switch SLA')
              sys.exit(1)
          print('SUCCESS: Production Latency SLA Gate passed!')
          "
